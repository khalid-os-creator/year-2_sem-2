name: Compress PDFs and Build Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'subjects/**'
  workflow_dispatch: # Enables manual triggering via GitHub Actions UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ghostscript & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript python3

      - name: Auto-compress new or modified PDFs
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep '\.pdf$' || true)
          else
            FILES=$(find subjects -type f -name "*.pdf" 2>/dev/null || true)
          fi

          if [ -z "$FILES" ]; then
            echo "No PDF changes detected."
          else
            echo "$FILES" | while read -r file; do
              if [ -f "$file" ]; then
                echo "Processing: $file"
                ORIG_SIZE=$(stat -c%s "$file")
                
                gs -sDEVICE=pdfwrite \
                   -dCompatibilityLevel=1.4 \
                   -dPDFSETTINGS=/ebook \
                   -dNOPAUSE -dQUIET -dBATCH \
                   -sOutputFile="${file}.tmp" "$file" || true

                if [ -f "${file}.tmp" ]; then
                  NEW_SIZE=$(stat -c%s "${file}.tmp")
                  if [ "$NEW_SIZE" -lt "$ORIG_SIZE" ] && [ "$NEW_SIZE" -gt 0 ]; then
                    mv "${file}.tmp" "$file"
                    echo "Compressed: $ORIG_SIZE -> $NEW_SIZE bytes"
                  else
                    rm -f "${file}.tmp"
                    echo "Skipped: Compressed file was not smaller."
                  fi
                fi
              fi
            done
          fi

      - name: Generate catalog.json
        run: |
          python3 -c '
          import os, json, re

          subjects_dir = "subjects"
          categories = ["lessons", "assignments", "labs", "exams", "summaries"]
          catalog = {}

          def clean_str(s):
              # Strip hidden Unicode direction/control characters (like \u200f, \u200e)
              return re.sub(r"[\u200e\u200f\u200b-\u200d\ufeff]", "", s).strip()

          if os.path.exists(subjects_dir):
              for subject in sorted(os.listdir(subjects_dir)):
                  sub_path = os.path.join(subjects_dir, subject)
                  if os.path.isdir(sub_path):
                      clean_subj = clean_str(subject)
                      catalog[clean_subj] = {}
                      
                      for cat in categories:
                          cat_path = os.path.join(sub_path, cat)
                          catalog[clean_subj][cat] = []
                          
                          if os.path.exists(cat_path) and os.path.isdir(cat_path):
                              for f in sorted(os.listdir(cat_path)):
                                  if f.lower().endswith(".pdf"):
                                      full_file_path = os.path.join(cat_path, f)
                                      file_size = os.path.getsize(full_file_path)
                                      clean_name = clean_str(f)
                                      
                                      catalog[clean_subj][cat].append({
                                          "name": clean_name,
                                          "path": f"subjects/{subject}/{cat}/{f}",
                                          "size": file_size
                                      })

          # ensure_ascii=False forces native UTF-8 (Arabic stays Arabic instead of \u062d...)
          with open("catalog.json", "w", encoding="utf-8") as out:
              json.dump(catalog, out, indent=2, ensure_ascii=False)

          print("Successfully generated clean catalog.json")
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-compressed PDFs and updated catalog.json [skip ci]"